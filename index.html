<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack Landing Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            background: white;

        h1 {
            font-size: 2.8rem;
            color: #0077cc;

        }

        p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #444;
        }

<body>
    <header>
        <h1>CleanTrack</h1>
        <p>Tervetuloa CleanTrackiin. Tämä on simppeli laskeutumissivu – ei kiirettä, ei sotkua. Vain selkeä, hallittu askel eteenpäin.</p>
    </header>

</html>
